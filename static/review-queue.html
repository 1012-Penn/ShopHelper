<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopHelper · 待审问题池</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; color: #20242b; background: #f5f7fb; }
    header { padding: 18px 28px; background: #fff; border-bottom: 1px solid #e5e8ee; }
    main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 18px; max-width: 1200px; margin: auto; }
    section { background: #fff; border: 1px solid #e5e8ee; border-radius: 12px; padding: 16px; }
    #items { display: grid; gap: 8px; margin-top: 12px; }
    .item { text-align: left; background: #fff; border: 1px solid #e1e5ec; border-radius: 9px; padding: 10px; cursor: pointer; }
    .item:hover, .item.active { border-color: #4f7cff; background: #f1f5ff; }
    .count { color: #4f7cff; float: right; font-weight: 700; }
    .muted { color: #737b88; font-size: 12px; }
    textarea { width: 100%; min-height: 120px; box-sizing: border-box; border: 1px solid #d6dae2; border-radius: 8px; padding: 10px; }
    button { border: 1px solid #4f7cff; background: #fff; color: #315ed6; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
    button.primary { background: #4f7cff; color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .toolbar { display: flex; gap: 8px; margin-top: 10px; }
    .source { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f6f8fc; white-space: pre-wrap; }
    .error { color: #d34b4b; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><strong>ShopHelper · 飞轮待审问题</strong><span class="muted">　标准化缺口 / 原话 / 召回依据</span></header>
  <main>
    <section><h3>问题队列</h3><label>审核状态 <select id="review-status"><option value="待审">待审</option><option value="通过">已通过</option></select></label><div id="items">加载中…</div></section>
    <section><h3 id="title">选择一条问题查看详情</h3><div id="detail" class="muted">人工审核时请对照原话和召回片段。</div></section>
  </main>
  <script src="/admin/assets/admin.js"></script>
  <script>
    const items = document.getElementById("items"), detail = document.getElementById("detail"), title = document.getElementById("title");
    const statusFilter = document.getElementById("review-status");
    let selected = null, viewVersion = 0;

    function errorText(err) {
      return err instanceof AdminAuth.ForbiddenError
        ? "权限不足：当前账号无此操作权限。"
        : (err.message || "请求失败");
    }

    function showError(err) {
      detail.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = errorText(err);
      detail.appendChild(box);
    }

    async function load() {
      const status = statusFilter.value || "待审";
      try {
        const body = await AdminAuth.requestJSON("/api/review-queue?status=" + encodeURIComponent(status));
        if ((statusFilter.value || "待审") !== status) return;
        items.innerHTML = "";
        for (const row of body.items || []) {
          const b = document.createElement("button"); b.className = "item";
          b.innerHTML = '<span class="count"></span><span class="question"></span><div class="muted"></div>';
          b.querySelector(".count").textContent = "×" + row.occurrence_count;
          b.querySelector(".question").textContent = row.normalized_question;
          b.querySelector(".muted").textContent = row.review_status === "通过"
            ? (row.index_status === "done" ? "已写入知识库" : "审核已保存，索引待重试")
            : (row.ai_suggested_answer || "暂无示例答案");
          b.onclick = () => openDetail(row.id, b); items.appendChild(b);
        }
        if (!body.items?.length) items.textContent = "暂无" + (status === "通过" ? "已通过" : "待审") + "问题";
      } catch (err) {
        items.textContent = errorText(err);
      }
    }

    async function openDetail(id, button) {
      const version = ++viewVersion;
      selected = null;
      detail.textContent = "加载中…";
      document.querySelectorAll(".item").forEach((x) => x.classList.remove("active")); button.classList.add("active");
      try {
        const body = await AdminAuth.requestJSON("/api/review-queue/" + id);
        if (version !== viewVersion) return;
        selected = body;
        renderDetail();
      } catch (err) {
        if (version === viewVersion) showError(err);
      }
    }

    function renderDetail() {
      const id = selected.id;
      const version = viewVersion;
      title.textContent = selected.normalized_question;
      detail.innerHTML = "";
      for (const q of selected.original_questions || []) {
        const box = document.createElement("div"); box.className = "source";
        box.textContent = "[" + q.source + "] " + q.raw_question + "\n原因: " + q.reason + "\n召回片段:\n" + JSON.stringify(q.retrieved_chunks || [], null, 2);
        detail.appendChild(box);
      }
      const label = document.createElement("p"); label.textContent = "核准答案"; detail.appendChild(label);
      const input = document.createElement("textarea"); input.value = selected.approved_answer || selected.ai_suggested_answer || ""; input.id = "answer";
      input.disabled = selected.review_status === "通过";
      detail.appendChild(input);
      const message = document.createElement("p"); message.setAttribute("role", "status"); detail.appendChild(message);
      const bar = document.createElement("div"); bar.className = "toolbar"; detail.appendChild(bar);
      const post = async (button, suffix, payload) => {
        if (version !== viewVersion || selected?.id !== id) return;
        const controls = [...bar.children];
        controls.forEach(control => { control.disabled = true; });
        try {
          const result = await AdminAuth.requestJSON("/api/review-queue/" + id + suffix, {
            method: "POST", headers: {"Content-Type": "application/json"},
            ...(payload ? {body: JSON.stringify(payload)} : {})
          });
          if (version !== viewVersion || selected?.id !== id) return;
          if (suffix === "/reject") detail.textContent = "已驳回。";
          else {
            selected = {...selected, ...result, review_status: "通过", approved_answer: payload?.approved_answer || selected.approved_answer};
            renderDetail();
          }
          try { await load(); }
          catch (_) { items.textContent = "列表刷新失败，请重新选择审核状态刷新。"; }
        } catch (error) {
          if (version === viewVersion) showError(error);
        } finally { controls.forEach(control => { control.disabled = false; }); }
      };
      if (selected.review_status === "通过") {
        message.textContent = selected.index_status === "done" ? "已通过并写入知识库。" : "审核已保存，索引待重试。";
        if (selected.index_status !== "done") {
          const retry = document.createElement("button"); retry.textContent = "重试写入知识库";
          retry.onclick = () => post(retry, "/retry-index"); bar.appendChild(retry);
        }
      } else {
        const approve = document.createElement("button"); approve.className = "primary"; approve.textContent = "通过并写入知识库";
        approve.onclick = () => post(approve, "/approve", {approved_answer: input.value});
        const reject = document.createElement("button"); reject.textContent = "驳回";
        reject.onclick = () => post(reject, "/reject");
        bar.append(approve, reject);
      }
      if (!AdminAuth.canWrite()) {
        [...bar.children].forEach(control => { control.disabled = true; });
        const note = document.createElement("p"); note.className = "muted";
        note.textContent = "当前账号为只读，无审核权限。";
        detail.appendChild(note);
      }
    }

    statusFilter.onchange = async () => {
      ++viewVersion; selected = null; title.textContent = "选择一条问题查看详情"; detail.textContent = "人工审核时请对照原话和召回片段。";
      await load();
    };

    async function initPage() {
      const session = await AdminAuth.init();
      if (!session) return;
      await load();
    }
    initPage();
  </script>
</body>
</html>
