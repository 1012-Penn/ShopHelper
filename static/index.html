<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小帮 · 店铺客服</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 12px; }
  #log { border: 1px solid #ddd; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 12px; }
  .msg { margin: 6px 0; white-space: pre-wrap; line-height: 1.5; }
  .user { color: #1a5fb4; }
  .assistant { color: #111; }
  #bar { display: flex; gap: 8px; margin-top: 12px; }
  #text { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
<h2>小帮 · 店铺客服</h2>
<div id="log"></div>
<div id="bar">
  <input id="text" placeholder="输入消息,回车发送" />
  <button id="send">发送</button>
</div>
<script>
const log = document.getElementById("log");
const text = document.getElementById("text");
let sessionId = null;
let busy = false;

function addMsg(cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send() {
  const message = text.value.trim();
  if (!message || busy) return;
  busy = true;
  text.value = "";
  addMsg("user").textContent = message;
  const bubble = addMsg("assistant");
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    if (!resp.ok) {
      const detail = (await resp.json()).detail || resp.status;
      bubble.textContent = "请求失败:" + detail;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.startsWith("data: ")) continue;
        const evt = JSON.parse(frame.slice(6));
        if (evt.type === "session") sessionId = evt.session_id;
        else if (evt.type === "token") {
          bubble.textContent += evt.content;
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === "error") {
          bubble.textContent += "\n[出错] " + evt.message;
        }
      }
    }
  } catch (e) {
    bubble.textContent += "\n[网络错误] " + e;
  } finally {
    busy = false;
  }
}

document.getElementById("send").onclick = send;
text.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
