<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小帮 · 店铺客服</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e8ee;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #4f7cff, #7c5cff);
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  header .title { font-size: 16px; font-weight: 600; color: #1a1d24; }
  header .sub { font-size: 12px; color: #8a919e; margin-top: 2px; }
  header .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #34c759; margin-right: 4px;
  }
  #new-chat {
    margin-left: auto;
    border: 1px solid #d6dae2; background: #fff; color: #5a6270;
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  #new-chat:hover { background: #f5f7fa; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    scroll-behavior: smooth;
  }
  .row { display: flex; margin: 10px 0; align-items: flex-end; gap: 8px; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 30px; height: 30px; font-size: 14px; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, #4f7cff, #6a5cff);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: #fff;
    color: #1a1d24;
    border: 1px solid #e5e8ee;
    border-bottom-left-radius: 4px;
  }
  .bubble.error { background: #fdecec; color: #b3261e; border-color: #f3c1bd; }
  .tool-trail { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .tool-trail:empty { display: none; }
  .tool-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: #5a6270;
    background: #f1f4f9; border: 1px solid #e0e5ee;
    border-radius: 999px; padding: 2px 10px;
  }
  .tool-badge .tdot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #f5a623; animation: blink 0.9s step-end infinite;
  }
  .tool-badge.done .tdot { background: #34c759; animation: none; }
  .bubble .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: #4f7cff;
    vertical-align: -0.15em;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #b6bdca;
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  .cite {
    color: #4f7cff; cursor: pointer; margin: 0 1px; font-weight: 600;
  }
  .cite:hover { text-decoration: underline; }
  .source-card {
    margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: #f6f8fc; border: 1px solid #e0e5ee; font-size: 13px;
  }
  .source-card .src-path { color: #5a6270; font-size: 12px; margin-bottom: 4px; }
  .source-card .src-q { font-weight: 600; margin-bottom: 2px; }
  .source-card .src-a { color: #333; white-space: pre-wrap; }
  .feedback { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; }
  .feedback button {
    border: 1px solid #d6dae2; background: #fff; border-radius: 6px;
    padding: 1px 8px; cursor: pointer; font-size: 13px;
  }
  .feedback button.picked { border-color: #4f7cff; background: #eef3ff; }
  .feedback button:disabled { cursor: default; opacity: .75; }
  .feedback .fb-status { color: #8a919e; }

  #bar {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e5e8ee;
  }
  #text {
    flex: 1;
    border: 1px solid #d6dae2;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14.5px;
    outline: none;
  }
  #text:focus { border-color: #4f7cff; }
  #send {
    border: none;
    background: linear-gradient(135deg, #4f7cff, #6a5cff);
    color: #fff;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14.5px;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }

  /* ch05:转人工/建工单独立按钮 + 系统提示 */
  .action-bar { display: flex; gap: 8px; margin-top: 8px; }
  .action-btn {
    border: 1px solid #4f7cff; background: #fff; color: #4f7cff;
    border-radius: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .action-btn:hover { background: #eef3ff; }
  .action-btn:disabled { cursor: default; opacity: .6; }
  .sys-row { display: flex; justify-content: center; margin: 10px 0; }
  .sys-msg {
    font-size: 12.5px; color: #5a6270; background: #e9edf3;
    border-radius: 999px; padding: 4px 14px;
  }

  /* ch06:指代消解灰字 + 订单选择器 + 退款表单 */
  .resolved-note { font-size: 12px; color: #8a919e; margin-bottom: 6px; }
  .order-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .order-card {
    border: 1px solid #d6dae2; background: #fff; border-radius: 10px;
    padding: 8px 12px; cursor: pointer; text-align: left; font-size: 13px;
  }
  .order-card:hover { border-color: #4f7cff; background: #eef3ff; }
  .order-card.picked { border-color: #4f7cff; background: #eef3ff; }
  .order-card:disabled { cursor: default; opacity: .7; }
  .order-card .o-title { font-weight: 600; color: #1a1d24; margin-bottom: 2px; }
  .order-card .o-meta { color: #8a919e; font-size: 12px; }
  .refund-form {
    margin-top: 8px; padding: 10px; border: 1px solid #e0e5ee;
    border-radius: 10px; background: #f6f8fc; display: flex; flex-direction: column; gap: 8px;
  }
  .refund-form .rf-title { font-size: 13px; font-weight: 600; color: #1a1d24; }
  .refund-form select, .refund-form input {
    border: 1px solid #d6dae2; border-radius: 8px; padding: 7px 10px; font-size: 13px; background: #fff;
  }
  .refund-form .rf-row { display: flex; align-items: center; gap: 8px; }
  .refund-form .rf-submit {
    border: none; background: linear-gradient(135deg, #4f7cff, #6a5cff);
    color: #fff; border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px;
  }
  .refund-form .rf-submit:disabled { opacity: .5; cursor: default; }
  .refund-form .rf-status { font-size: 12px; color: #34c759; }

  /* ch07:会话侧栏——多会话列表,点击切换回载历史;加载失败整体隐藏(静默降级) */
  #main { flex: 1; display: flex; min-height: 0; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #sidebar {
    width: 236px; flex: none; background: #fff; border-right: 1px solid #e5e8ee;
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar.hidden { display: none; }
  #sidebar .sb-head {
    padding: 12px 14px; font-size: 13px; font-weight: 600; color: #5a6270;
    border-bottom: 1px solid #eef1f5; flex: none;
  }
  #conv-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #conv-list li {
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: #1a1d24; margin-bottom: 2px;
  }
  #conv-list li:hover { background: #f5f7fa; }
  #conv-list li.active { background: #eef3ff; }
  #conv-list li .preview {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #conv-list li .meta {
    font-size: 11px; color: #8a919e; margin-top: 2px;
    display: flex; gap: 6px; align-items: center;
  }
  #conv-list li .sum-badge {
    background: #e8f7ee; color: #1d9a55; border-radius: 999px;
    padding: 0 6px; font-size: 10.5px;
  }

  /* ch08:工单预览卡(确认提交/取消) */
  .ticket-card {
    margin-top: 8px; padding: 10px; border: 1px solid #4f7cff33;
    border-radius: 10px; background: #f6f8ff; display: flex; flex-direction: column; gap: 8px;
  }
  .ticket-card .t-title { font-size: 13px; font-weight: 600; color: #1a1d24; }
  .ticket-card .t-type {
    background: #eef3ff; color: #2b5bd7; border-radius: 999px; padding: 1px 8px;
    font-size: 11.5px;
  }
  .ticket-card .t-desc { font-size: 13px; color: #333; white-space: pre-wrap; }
  .ticket-card .t-bar { display: flex; align-items: center; gap: 8px; }
  .ticket-card button {
    border: 1px solid #4f7cff; background: #fff; color: #4f7cff;
    border-radius: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .ticket-card .t-confirm { background: linear-gradient(135deg, #4f7cff, #6a5cff); color: #fff; border: none; }
  .ticket-card button:disabled { opacity: .5; cursor: default; }
  .ticket-card .t-status { font-size: 12px; color: #34c759; }
</style>
</head>
<body>
<header>
  <div class="avatar">帮</div>
  <div>
    <div class="title">小帮 · 店铺客服</div>
    <div class="sub"><span class="dot"></span>在线 · 有问必答</div>
  </div>
  <button id="new-chat">新对话</button>
</header>

<div id="main">
  <aside id="sidebar">
    <div class="sb-head">会话列表</div>
    <ul id="conv-list"></ul>
  </aside>
  <div id="chat-col">
    <div id="log"></div>

    <div id="bar">
      <input id="text" placeholder="输入消息,回车发送" autocomplete="off" />
      <button id="send">发送</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");
const text = document.getElementById("text");
const sendBtn = document.getElementById("send");
const state = { sessionId: null, busy: false };
let lastUserMessage = "";

function nearBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}
function scrollDown(force) {
  if (force || nearBottom()) log.scrollTop = log.scrollHeight;
}
function addRow(cls, withAvatar) {
  const row = document.createElement("div");
  row.className = "row " + cls;
  if (withAvatar) {
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "帮";
    row.appendChild(av);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  row.appendChild(bubble);
  log.appendChild(row);
  scrollDown(true);
  return bubble;
}
function addUserMsg(content) {
  addRow("user", false).textContent = content;
}
// 机器人气泡:徽章轨(tool-trail)+ 正文区(content);正文先放"打字中"动画
function addBotMsg() {
  const bubble = addRow("bot", true);
  bubble.innerHTML = '<div class="tool-trail"></div><div class="content"><span class="typing"><i></i><i></i><i></i></span></div>';
  return bubble;
}
function addToolBadge(bubble, label) {
  const badge = document.createElement("span");
  badge.className = "tool-badge";
  badge.innerHTML = '<span class="tdot"></span>';
  badge.appendChild(document.createTextNode(label));
  bubble.querySelector(".tool-trail").appendChild(badge);
  scrollDown();
  return badge;
}
function finishToolBadges(bubble) {
  bubble.querySelectorAll(".tool-badge:not(.done)").forEach((b) => b.classList.add("done"));
}
function startStreamText(bubble) {
  const content = bubble.querySelector(".content");
  content.textContent = "";
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  content.appendChild(cursor);
  return {
    append(t) { cursor.before(document.createTextNode(t)); scrollDown(); },
    finish() { cursor.remove(); },
  };
}

// ch05:转人工/建工单——两个独立选项,用户自选,后端不自动执行
function addSystemMsg(content) {
  const row = document.createElement("div");
  row.className = "sys-row";
  const msg = document.createElement("span");
  msg.className = "sys-msg";
  msg.textContent = content;
  row.appendChild(msg);
  log.appendChild(row);
  scrollDown(true);
}
function renderActions(bubble, items) {
  if (!items || !items.length) return;
  const bar = document.createElement("div");
  bar.className = "action-bar";
  for (const it of items) {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = it.label;
    btn.onclick = () => {
      if (it.action === "transfer_human") transferHuman(bar);
      else if (it.action === "create_ticket") createTicket(btn);
      else if (it.action === "refund_form") renderRefundForm(bar, bubble, it.order_id);
    };
    bar.appendChild(btn);
  }
  bubble.appendChild(bar);
  scrollDown();
}
async function transferHuman(bar) {
  // 纯前端模拟:不调任何接口
  bar.remove();
  addSystemMsg("已转接人工客服");
  addBotMsg().querySelector(".content").textContent = "您好,我是客服小猫,请问有什么可以帮您的";
  scrollDown(true);
}
async function createTicket(btn) {
  if (!confirm("确认为您创建工单吗?")) return;
  btn.disabled = true;
  try {
    const resp = await fetch("/api/tickets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, description: lastUserMessage }),
    });
    const body = await resp.json();
    btn.textContent = resp.ok ? "工单 " + body.ticket_no + " 已创建" : "创建失败";
  } catch (e) {
    btn.textContent = "创建失败";
  }
}

// ch06:订单选择器——可点订单卡;点选后带原问题+补全问题+意图回传,resume 旁路续走子流程
function addResolvedNote(bubble, question) {
  const note = document.createElement("div");
  note.className = "resolved-note";
  note.textContent = "已理解:" + question;
  bubble.insertBefore(note, bubble.querySelector(".content"));
  scrollDown();
}
function renderOrderSelector(bubble, evt) {
  const content = bubble.querySelector(".content");
  if (content) content.textContent = "";
  const bar = document.createElement("div");
  bar.className = "order-bar";
  for (const o of evt.items || []) {
    const card = document.createElement("button");
    card.className = "order-card";
    card.innerHTML = '<div class="o-title"></div><div class="o-meta"></div>';
    card.querySelector(".o-title").textContent = "订单" + o.order_id + " · " + o.product;
    card.querySelector(".o-meta").textContent = "¥" + o.amount + " · " + o.status;
    card.onclick = () => pickOrder(bar, card, o, evt);
    bar.appendChild(card);
  }
  bubble.appendChild(bar);
  scrollDown();
}
async function pickOrder(bar, card, order, evt) {
  if (state.busy) return;
  [...bar.children].forEach((c) => { c.disabled = true; });
  card.classList.add("picked");
  addUserMsg(evt.original || "");
  lastUserMessage = evt.original || "";  // 点旧卡片后「建工单」描述应跟随该轮
  const bubble = addBotMsg();
  setBusy(true);
  try {
    await streamChat({ message: evt.original || "", session_id: state.sessionId,
                       resume: { order_id: order.order_id, question: evt.question,
                                 intent: evt.intent } }, bubble);
  } finally {
    setBusy(false);
    text.focus();
    if (bubble.classList.contains("error")) {
      [...bar.children].forEach((c) => { c.disabled = false; c.classList.remove("picked"); });
    }
  }
}

// ch08:建工单确认流——工单预览卡片(确认提交/取消),无状态回传(载荷随请求带回)
function renderTicketPreview(bubble, evt) {
  const content = bubble.querySelector(".content");
  if (content) content.textContent = "";
  const card = document.createElement("div");
  card.className = "ticket-card";
  card.innerHTML =
    '<div class="t-title">工单确认 · <span class="t-type"></span></div>' +
    '<div class="t-desc"></div>' +
    '<div class="t-bar"><button class="t-confirm">确认提交</button>' +
    '<button class="t-cancel">取消</button><span class="t-status"></span></div>';
  card.querySelector(".t-type").textContent = evt.ticket_type || "售后";
  card.querySelector(".t-desc").textContent = evt.description || "";
  card.querySelector(".t-confirm").onclick = async () => {
    card.querySelector(".t-confirm").disabled = true;
    card.querySelector(".t-cancel").disabled = true;
    const status = card.querySelector(".t-status");
    try {
      const resp = await fetch("/api/tickets/confirm", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: state.sessionId,
          ticket_type: evt.ticket_type, description: evt.description }),
      });
      const body = await resp.json();
      if (resp.ok) {
        status.textContent = "已提交";
        addBotMsg().querySelector(".content").textContent =
          "工单 " + body.ticket_no + " 已创建,我们会尽快跟进处理。";
        scrollDown(true);
      } else {
        status.textContent = "提交失败";
        card.querySelector(".t-confirm").disabled = false;
      }
    } catch (e) {
      status.textContent = "提交失败";
      card.querySelector(".t-confirm").disabled = false;
    }
  };
  card.querySelector(".t-cancel").onclick = async () => {
    card.querySelector(".t-confirm").disabled = true;
    card.querySelector(".t-cancel").disabled = true;
    try {
      await fetch("/api/tickets/cancel", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: state.sessionId, reason: "用户取消确认" }),
      });
    } catch (e) {}
    const sys = document.createElement("div");
    sys.className = "sys-row";
    const msg = document.createElement("span");
    msg.className = "sys-msg";
    msg.textContent = "已取消,未创建工单";
    sys.appendChild(msg);
    log.appendChild(sys);
    scrollDown(true);
  };
  bubble.appendChild(card);
  scrollDown();
}

// ch06:退款单表单——原因固定类目下拉 + 备注,提交复用 /api/tickets(类型:售后)
function renderRefundForm(bar, bubble, orderId) {
  bar.remove();
  const form = document.createElement("div");
  form.className = "refund-form";
  form.innerHTML =
    '<div class="rf-title">申请退款 · 订单' + orderId + '</div>' +
    '<select class="rf-reason"></select>' +
    '<input class="rf-note" placeholder="补充说明(可空)" />' +
    '<div class="rf-row"><button class="rf-submit">提交退款申请</button><span class="rf-status"></span></div>';
  const REASONS = ["质量问题", "七天无理由", "尺寸不合适", "发错货", "与描述不符", "不想要了"];
  for (const r of REASONS) form.querySelector(".rf-reason").add(new Option(r, r));
  form.querySelector(".rf-submit").onclick = async (ev) => {
    ev.target.disabled = true;  // 防双击重复建单
    const reason = form.querySelector(".rf-reason").value;
    const note = form.querySelector(".rf-note").value.trim();
    const status = form.querySelector(".rf-status");
    try {
      const resp = await fetch("/api/tickets", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: state.sessionId, ticket_type: "售后",
          description: "订单" + orderId + "申请退款;原因:" + reason + (note ? ";备注:" + note : "") }),
      });
      const body = await resp.json();
      if (resp.ok) {
        form.querySelector(".rf-reason").disabled = true;
        form.querySelector(".rf-note").disabled = true;
        status.textContent = "工单 " + body.ticket_no + " 已创建";
      } else { ev.target.disabled = false; status.textContent = "提交失败"; }
    } catch (e) { ev.target.disabled = false; status.textContent = "提交失败"; }
  };
  bubble.appendChild(form);
  scrollDown();
}

// ch04:答案收尾后,把正文里的 [n] 替换成可点角标;citations 帧提供 n → 来源映射
function renderCitations(bubble, citations) {
  if (!citations || !citations.length) return;
  const content = bubble.querySelector(".content");
  const text = content.textContent;
  if (!/\[\d+\]/.test(text)) return;
  const byN = new Map(citations.map((c) => [c.n, c]));
  content.textContent = "";
  const re = /\[(\d+)\]/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    const n = parseInt(m[1], 10);
    content.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (byN.has(n)) {
      const sup = document.createElement("sup");
      sup.className = "cite";
      sup.textContent = "[" + n + "]";
      sup.onclick = () => toggleSource(bubble, n, citations);
      content.appendChild(sup);
    } else {
      content.appendChild(document.createTextNode(m[0]));
    }
    last = m.index + m[0].length;
  }
  content.appendChild(document.createTextNode(text.slice(last)));
}

function toggleSource(bubble, n, citations) {
  const existing = bubble.querySelector(".source-card");
  if (existing && existing.dataset.n == n) { existing.remove(); return; }
  if (existing) existing.remove();
  const c = citations.find((x) => x.n === n);
  if (!c) return;
  const card = document.createElement("div");
  card.className = "source-card";
  card.dataset.n = n;
  card.innerHTML = '<div class="src-path"></div><div class="src-q"></div><div class="src-a"></div>';
  card.querySelector(".src-path").textContent = "来源[" + n + "] " + (c.section_path || "(无章节路径)");
  card.querySelector(".src-q").textContent = c.question;
  card.querySelector(".src-a").textContent = c.answer;
  bubble.appendChild(card);
  scrollDown();
}

// ch04:满意度反馈(纯前端采集,一次性锁定,为数据飞轮留入口)
function addFeedback(bubble) {
  const bar = document.createElement("div");
  bar.className = "feedback";
  const up = document.createElement("button");
  up.textContent = "👍";
  const down = document.createElement("button");
  down.textContent = "👎";
  const status = document.createElement("span");
  status.className = "fb-status";
  function pick(which) {
    (which === "up" ? up : down).classList.add("picked");
    status.textContent = "已反馈";
    up.disabled = down.disabled = true;
  }
  up.onclick = () => pick("up");
  down.onclick = () => pick("down");
  bar.append(up, down, status);
  bubble.appendChild(bar);
}

function setBusy(v) {
  state.busy = v;
  sendBtn.disabled = v;
}

// fetch /api/chat + SSE 逐帧驱动一个气泡;send 与订单卡点选(pickOrder)共用
async function streamChat(payload, bubble) {
  let stream = null;
  let citations = [];
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) {
      let detail = resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (_) {}
      bubble.classList.add("error");
      bubble.querySelector(".content").textContent = "请求失败:" + detail;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.startsWith("data: ")) continue;
        const evt = JSON.parse(frame.slice(6));
        if (evt.type === "session") {
          state.sessionId = evt.session_id;
        } else if (evt.type === "tool_status") {
          addToolBadge(bubble, evt.label || evt.name);
        } else if (evt.type === "citations") {
          citations = evt.items || [];
        } else if (evt.type === "actions") {
          renderActions(bubble, evt.items);
        } else if (evt.type === "resolved") {
          if (evt.changed) addResolvedNote(bubble, evt.question);
        } else if (evt.type === "order_selector") {
          renderOrderSelector(bubble, evt);
        } else if (evt.type === "ticket_preview") {
          renderTicketPreview(bubble, evt);
        } else if (evt.type === "token") {
          if (!stream) stream = startStreamText(bubble);
          stream.append(evt.content);
        } else if (evt.type === "error") {
          bubble.classList.add("error");
          bubble.querySelector(".content").textContent = "[出错] " + evt.message;
        }
        // done:无需处理,收尾统一走 finally
      }
    }
  } catch (e) {
    bubble.classList.add("error");
    bubble.querySelector(".content").textContent = "[网络错误] " + e;
  } finally {
    finishToolBadges(bubble);
    if (stream) stream.finish();
    else if (!bubble.classList.contains("error") && !bubble.querySelector(".order-bar"))
      bubble.querySelector(".content").textContent = "(空回复)";
    if (!bubble.classList.contains("error")) {
      renderCitations(bubble, citations);
      if (!bubble.querySelector(".order-bar")) {
        addFeedback(bubble);
      }
      loadConversations();  // 发送完成后静默刷新侧栏(新会话上榜/预览更新)
    }
  }
}

async function send() {
  const message = text.value.trim();
  if (!message || state.busy) return;
  setBusy(true);
  text.value = "";
  lastUserMessage = message;
  addUserMsg(message);

  const bubble = addBotMsg();
  try {
    await streamChat({ message, session_id: state.sessionId }, bubble);
  } finally {
    setBusy(false);
    text.focus();
  }
}

// ch07:会话侧栏——列表(新在前/首问预览/已摘要标记)、点击切换回载、发送后静默刷新;
// 任何侧栏请求失败只隐藏侧栏,不影响聊天区(静默降级)
const sidebar = document.getElementById("sidebar");
const convList = document.getElementById("conv-list");
let convItemsCache = [];

function renderConvList(items) {
  convItemsCache = items || [];
  convList.innerHTML = "";
  for (const it of convItemsCache) {
    const li = document.createElement("li");
    if (it.id === state.sessionId) li.classList.add("active");
    const preview = document.createElement("div");
    preview.className = "preview";
    preview.textContent = it.preview || "(无消息)";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(document.createTextNode("会话 " + it.id));
    if (it.summarized) {
      const badge = document.createElement("span");
      badge.className = "sum-badge";
      badge.textContent = "摘要";
      meta.appendChild(badge);
    }
    li.append(preview, meta);
    li.onclick = () => switchConversation(it.id);
    convList.appendChild(li);
  }
}

async function loadConversations() {
  try {
    const resp = await fetch("/api/conversations");
    if (!resp.ok) throw new Error(resp.status);
    renderConvList((await resp.json()).items || []);
    sidebar.classList.remove("hidden");  // 自愈:瞬时失败恢复后侧栏重新可见
  } catch (e) {
    sidebar.classList.add("hidden");
  }
}

async function switchConversation(id) {
  if (state.busy || id === state.sessionId) return;
  let body;
  try {
    const resp = await fetch("/api/conversations/" + id + "/messages");
    if (!resp.ok) throw new Error(resp.status);
    body = await resp.json();
  } catch (e) {
    return;  // 回载失败:保留当前会话不动
  }
  state.sessionId = id;
  log.innerHTML = "";
  for (const m of body.messages || []) {
    if (m.role === "user") addUserMsg(m.content || "");
    else if (m.role === "assistant" && m.content) {
      const b = addBotMsg();
      b.querySelector(".content").textContent = m.content;
    }
  }
  renderConvList(convItemsCache);  // 高亮刷新
  scrollDown(true);
  text.focus();
}

sendBtn.onclick = send;
text.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.getElementById("new-chat").onclick = () => {
  if (state.busy) return;
  state.sessionId = null;
  log.innerHTML = "";
  loadConversations();  // 清高亮,旧会话仍在侧栏可切回
  text.focus();
};
text.focus();
loadConversations();
setInterval(() => { if (!state.busy) loadConversations(); }, 15000);
</script>
