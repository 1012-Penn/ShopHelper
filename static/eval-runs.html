<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评估趋势</title>
<style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#20242b}header{padding:18px 28px;background:#fff;border-bottom:1px solid #e5e8ee}main{max-width:1100px;margin:18px auto;background:#fff;border:1px solid #e5e8ee;border-radius:12px;padding:18px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid #eef1f5}th:first-child,td:first-child{text-align:left}.down{color:#d34b4b}.up{color:#1c9b62}</style></head>
<body><header><strong>ShopHelper · 自动评估趋势</strong><span>　Recall@K / MRR / Faithfulness</span></header><main><table><thead><tr><th>轮次</th><th>数据量</th><th>Recall@3</th><th>Recall@5</th><th>Recall@10</th><th>MRR</th><th>Faithfulness</th></tr></thead><tbody id="rows"><tr><td colspan="7">加载中…</td></tr></tbody></table></main>
<script>const keys=["recall_at_3","recall_at_5","recall_at_10","mrr","faithfulness"];async function load(){const data=await (await fetch("/api/eval-runs")).json();const runs=data.items||[];const body=document.getElementById("rows");body.innerHTML="";runs.forEach((r,i)=>{const tr=document.createElement("tr");const cells=["#"+r.id,r.dataset_size,...keys.map(k=>{const v=Number(r.metrics[k]||0);const prev=i?Number(runs[i-1].metrics[k]||0):null;const d=prev===null?"":(v<prev?" ↓":v>prev?" ↑":" →");return `<span class='${d.includes("↓")?"down":d.includes("↑")?"up":""}'>${v.toFixed(3)}${d}</span>`})];tr.innerHTML=cells.map(x=>`<td>${x}</td>`).join("");body.appendChild(tr)});if(!runs.length)body.innerHTML="<tr><td colspan='7'>尚无评估轮次,请运行 scripts/run_eval.py</td></tr>"}load();</script></body></html>
