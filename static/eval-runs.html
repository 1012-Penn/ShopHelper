<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>评估趋势</title>
  <style>
    body{font:14px system-ui;margin:0;background:#f5f7fb;color:#20242b}
    header{padding:18px 28px;background:#fff;border-bottom:1px solid #e5e8ee}
    main{max-width:1100px;margin:18px auto;background:#fff;border:1px solid #e5e8ee;border-radius:12px;padding:18px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:right;padding:10px;border-bottom:1px solid #eef1f5}
    th:first-child,td:first-child{text-align:left}
    .down{color:#d34b4b}.up{color:#1c9b62}
    .error{color:#d34b4b;text-align:left}
  </style>
</head>
<body>
  <header><strong>ShopHelper · 自动评估趋势</strong><span>　Recall@K / MRR / Faithfulness</span></header>
  <main>
    <table>
      <thead>
        <tr><th>轮次</th><th>数据量</th><th>Recall@3</th><th>Recall@5</th><th>Recall@10</th><th>MRR</th><th>Faithfulness</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7">加载中…</td></tr></tbody>
    </table>
  </main>
  <script src="/admin/assets/admin.js"></script>
  <script>
    const keys = ["recall_at_3", "recall_at_5", "recall_at_10", "mrr", "faithfulness"];

    async function load() {
      const data = await AdminAuth.requestJSON("/api/eval-runs");
      const runs = data.items || [];
      const body = document.getElementById("rows");
      body.innerHTML = "";
      runs.forEach((run, index) => {
        const tr = document.createElement("tr");
        const cells = ["#" + run.id, run.dataset_size, ...keys.map((key) => {
          const value = Number(run.metrics[key] || 0);
          const previous = index ? Number(runs[index - 1].metrics[key] || 0) : null;
          const delta = previous === null ? "" : (value < previous ? " ↓" : value > previous ? " ↑" : " →");
          const cls = delta.includes("↓") ? "down" : delta.includes("↑") ? "up" : "";
          return `<span class="${cls}">${value.toFixed(3)}${delta}</span>`;
        })];
        tr.innerHTML = cells.map((cell) => `<td>${cell}</td>`).join("");
        body.appendChild(tr);
      });
      if (!runs.length) {
        body.innerHTML = "<tr><td colspan='7'>尚无评估轮次,请运行 scripts/run_eval.py</td></tr>";
      }
    }

    async function initPage() {
      const session = await AdminAuth.init();
      if (!session) return;
      try {
        await load();
      } catch (err) {
        document.getElementById("rows").innerHTML =
          "<tr><td colspan='7' class='error'>" + (err.message || "加载失败") + "</td></tr>";
      }
    }
    initPage();
  </script>
</body>
</html>
